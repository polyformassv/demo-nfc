<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel App — Excel Automotriz</title>
<style>
  :root {
    --blue: #0A2864;
    --blue-mid: #3D5A9E;
    --gray-bg: #F4F5F7;
    --border: #E0E0E0;
    --dark: #1A1A1A;
    --gray-mid: #6B6B6B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border: 1px solid var(--border);
  }
  .icon {
    width: 64px; height: 64px;
    background: var(--blue);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 30px;
  }
  h1 { font-size: 19px; color: var(--blue); margin-bottom: 8px; }
  p { font-size: 14px; color: var(--gray-mid); line-height: 1.5; margin-bottom: 24px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    background: var(--blue);
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--blue-mid); }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .redirecting .manual { display: none; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <div class="icon" id="icon" style="display:none">🔧</div>
  <h1 id="title">Abriendo Excel App…</h1>
  <p id="sub">Te estamos redirigiendo a la tienda de aplicaciones.</p>
  <div class="manual" id="manual" style="display:none">
    <a class="btn" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.excelautomotriz.excelOnline">Ver en Google Play</a>
    <a class="btn" id="iosBtn" href="https://apps.apple.com/app/id1159815614">Ver en App Store</a>
  </div>
</div>

<script>
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /android/i.test(ua);

  const playUrl = "https://play.google.com/store/apps/details?id=com.excelautomotriz.excelOnline";
  const appleUrl = "https://apps.apple.com/app/id1159815614";

  function showManual() {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('icon').style.display = 'flex';
    document.getElementById('title').textContent = 'Excel App';
    document.getElementById('sub').textContent = 'Elegí tu tienda para continuar.';
    document.getElementById('manual').style.display = 'block';
  }

  if (isAndroid) {
    window.location.href = playUrl;
    setTimeout(showManual, 1200);
  } else if (isIOS) {
    window.location.href = appleUrl;
    setTimeout(showManual, 1200);
  } else {
    showManual();
  }
</script>

</body>
</html>
