<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Excel Talleres · Contacto</title>
<style>
  :root {
    --bg:       #1f2023;
    --card:     #2b2d31;
    --line:     #3a3d43;
    --text:     #f3f4f6;
    --muted:    #a3a7b0;
    --red:      #c0403f;
    --red-dark: #a53332;
    --wa:       #25d366;
    --wa-dark:  #1da851;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 20px 20px;
  }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .mark {
    display: inline-block;
    width: 48px; height: 6px;
    background: var(--red);
    border-radius: 3px;
    margin-bottom: 14px;
  }
  .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.3px; }
  .brand p  { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .asesor {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .asesor .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  .asesor .name { font-size: 16px; font-weight: 700; margin-top: 2px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 54px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid transparent;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 10px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, background .15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .btn-wa   { background: var(--wa); color: #06210f; }
  .btn-wa:active { background: var(--wa-dark); }
  .btn-red  { background: var(--red); }
  .btn-red:active { background: var(--red-dark); }
  .btn-ghost { background: transparent; border-color: var(--line); }

  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row .btn { margin-bottom: 0; }
  .row .btn-call { flex: 1 1 auto; }
  .row .btn-mini { flex: 0 0 64px; width: 64px; padding: 0; }

  .foot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<main class="card">
  <header class="brand">
    <div class="mark"></div>
    <h1>Excel Talleres</h1>
    <p>Estamos para ayudarle</p>
  </header>

  <a class="btn btn-wa" id="btnAsesor" href="#" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12 21.8a9.8 9.8 0 0 1-5.05-1.4l-.36-.21-3.75.98 1-3.65-.24-.37A9.8 9.8 0 1 1 12 21.8M12 0C5.37 0 0 5.37 0 12c0 2.03.5 3.93 1.4 5.6L0 24l6.56-1.37A11.94 11.94 0 0 0 12 24c6.63 0 12-5.37 12-12S18.63 0 12 0z"/></svg>
    <span id="btnAsesorTxt">Escribir a mi asesor</span>
  </a>

  <a class="btn btn-wa" id="btnCall" href="#">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12 21.8a9.8 9.8 0 0 1-5.05-1.4l-.36-.21-3.75.98 1-3.65-.24-.37A9.8 9.8 0 1 1 12 21.8M12 0C5.37 0 0 5.37 0 12c0 2.03.5 3.93 1.4 5.6L0 24l6.56-1.37A11.94 11.94 0 0 0 12 24c6.63 0 12-5.37 12-12S18.63 0 12 0z"/></svg>
    <span>Escribir al call center</span>
  </a>

  <a class="btn btn-ghost" id="btnApp" href="https://play.google.com/store/apps/details?id=com.excelautomotriz.excelOnline" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg>
    <span>Abrir Excel App</span>
  </a>

  <a class="btn btn-ghost" href="https://excelautomotriz.com/el-salvador/sucursales/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    <span>Ver sucursales</span>
  </a>

  <p class="foot">Polyformas SV</p>
</main>

<script>
/* ═════════════════════════════════════════════
   CONFIGURACIÓN — editar acá para cambiar números
   (el NFC del llavero no se reprograma nunca)
   ═════════════════════════════════════════════ */
const CALL_CENTER = { telefono: '50322104200', visible: '2210-4200' };

// Cada llavero lleva ?id=<clave>. Para agregar un asesor, agregar una fila.
const ASESORES = {
  fidel: { nombre: 'Fidel Sorto', whatsapp: '50371295966' }
};

const MENSAJE = 'Hola, soy cliente de Excel Talleres. Mi placa es: ';

const PLAY_URL  = 'https://play.google.com/store/apps/details?id=com.excelautomotriz.excelOnline';
const APPLE_URL = 'https://apps.apple.com/app/id1159815614';

function waLink(numero) {
  return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(MENSAJE);
}

(function init() {
  // Asesor según ?id= (si falta o no existe, simplemente no se muestra)
  let id = '';
  try { id = (new URLSearchParams(window.location.search).get('id') || '').trim().toLowerCase(); } catch (e) {}
  const asesor = ASESORES[id];
  if (asesor) {
    const b = document.getElementById('btnAsesor');
    b.href = waLink(asesor.whatsapp);
    b.hidden = false;
  }

  // Call center: WhatsApp (desde ahí el cliente decide escribir o llamar)
  document.getElementById('btnCall').href = waLink(CALL_CENTER.telefono);

  // App: tienda según el sistema del teléfono
  const ua = navigator.userAgent || '';
  const esIOS = /iPad|iPhone|iPod/.test(ua);
  document.getElementById('btnApp').href = esIOS ? APPLE_URL : PLAY_URL;
})();
</script>
</body>
</html>
